name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml', 'checker/probe.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 checker/probe.py
      - name: Save results to the probe branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe
          git rm -rf --cached . > /dev/null
          git add -f out
          git commit -q -m "Probe results"
          git push -f origin probe
